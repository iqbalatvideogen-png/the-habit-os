<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1800" width="1200" height="1800">
  <defs>
    <linearGradient id="glassGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#e2e8f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cbd5e1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    <filter id="glassEffect" x="0" y="0" width="100%" height="100%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="1800" fill="url(#glassGradient)" />
  
  <!-- Glass overlay effect -->
  <rect x="100" y="100" width="1000" height="1600" rx="40" ry="40" 
        fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2" 
        filter="url(#glassEffect)" opacity="0.5"/>
  
  <!-- Main Title -->
  <text x="600" y="400" text-anchor="middle" 
        font-family="Inter, sans-serif" font-size="72" font-weight="700" 
        fill="url(#textGradient)">
    THE HABIT OS
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="520" text-anchor="middle" 
        font-family="Inter, sans-serif" font-size="36" font-weight="400" 
        fill="#475569">
    Build a Life That Runs on Great Habits
  </text>
  
  <!-- Author -->
  <text x="600" y="650" text-anchor="middle" 
        font-family="Inter, sans-serif" font-size="28" font-weight="500" 
        fill="#64748b">
    By MD Iqbal Bajmi
  </text>
  
  <!-- Decorative elements -->
  <circle cx="200" cy="300" r="80" fill="rgba(37, 99, 235, 0.1)" opacity="0.5"/>
  <circle cx="1000" cy="300" r="80" fill="rgba(37, 99, 235, 0.1)" opacity="0.5"/>
  <circle cx="200" cy="1500" r="80" fill="rgba(37, 99, 235, 0.1)" opacity="0.5"/>
  <circle cx="1000" cy="1500" r="80" fill="rgba(37, 99, 235, 0.1)" opacity="0.5"/>
  
  <!-- Tagline at bottom -->
  <text x="600" y="1700" text-anchor="middle" 
        font-family="Inter, sans-serif" font-size="24" font-weight="400" 
        fill="#94a3b8">
    A Comprehensive, Research-Backed Guide to Mastering Your Habits
  </text>
</svg>