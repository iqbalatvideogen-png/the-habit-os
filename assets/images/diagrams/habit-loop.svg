<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="4" stdDeviation="6" flood-color="rgba(0,0,0,0.1)" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" 
        font-family="Inter, sans-serif" font-size="24" font-weight="600" 
        fill="#1e293b">
    The Habit Loop
  </text>
  
  <!-- Subtitle -->
  <text x="400" y="65" text-anchor="middle" 
        font-family="Inter, sans-serif" font-size="14" 
        fill="#64748b">
    How Habits Form and How to Change Them
  </text>
  
  <!-- Main diagram -->
  <g transform="translate(200, 100)">
    <!-- Cue -->
    <rect x="0" y="0" width="180" height="100" rx="10" ry="10" 
          fill="#e0f2fe" stroke="#0284c7" stroke-width="2" filter="url(#shadow)"/>
    <text x="90" y="30" text-anchor="middle" 
          font-family="Inter, sans-serif" font-size="18" font-weight="600" 
          fill="#0f172a">
      CUE
    </text>
    <text x="90" y="60" text-anchor="middle" 
          font-family="Inter, sans-serif" font-size="12" 
          fill="#475569">
      Trigger
    </text>
    <text x="90" y="85" text-anchor="middle" 
          font-family="Inter, sans-serif" font-size="10" 
          fill="#64748b">
      (Time, Location, Emotion, etc.)
    </text>
    
    <!-- Arrow to Routine -->
    <path d="M180 50 L260 50 L250 45 L260 50 L250 55 L260 50" 
          fill="none" stroke="#0284c7" stroke-width="2"/>
    
    <!-- Routine -->
    <rect x="280" y="0" width="180" height="100" rx="10" ry="10" 
          fill="#dbeafe" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
    <text x="370" y="30" text-anchor="middle" 
          font-family="Inter, sans-serif" font-size="18" font-weight="600" 
          fill="#0f172a">
      ROUTINE
    </text>
    <text x="370" y="60" text-anchor="middle" 
          font-family="Inter, sans-serif" font-size="12" 
          fill="#475569">
      Behavior
    </text>
    <text x="370" y="85" text-anchor="middle" 
          font-family="Inter, sans-serif" font-size="10" 
          fill="#64748b">
      (Action, Habit, Response)
    </text>
    
    <!-- Arrow to Reward -->
    <path d="M460 50 L540 50 L530 45 L540 50 L530 55 L540 50" 
          fill="none" stroke="#0284c7" stroke-width="2"/>
    
    <!-- Reward -->
    <rect x="560" y="0" width="180" height="100" rx="10" ry="10" 
          fill="#e0f2fe" stroke="#0284c7" stroke-width="2" filter="url(#shadow)"/>
    <text x="650" y="30" text-anchor="middle" 
          font-family="Inter, sans-serif" font-size="18" font-weight="600" 
          fill="#0f172a">
      REWARD
    </text>
    <text x="650" y="60" text-anchor="middle" 
          font-family="Inter, sans-serif" font-size="12" 
          fill="#475569">
      Benefit
    </text>
    <text x="650" y="85" text-anchor="middle" 
          font-family="Inter, sans-serif" font-size="10" 
          fill="#64748b">
      (Pleasure, Relief, Satisfaction)
    </text>
    
    <!-- Arrow back to Cue (completing the loop) -->
    <path d="M650 100 L650 180 L640 170 L650 180 L660 170" 
          fill="none" stroke="#0284c7" stroke-width="2"/>
    <path d="M100 180 L650 180" 
          fill="none" stroke="#0284c7" stroke-width="2" stroke-dasharray="5,5"/>
    <path d="M640 170 L650 180 L640 190" 
          fill="none" stroke="#0284c7" stroke-width="2"/>
  </g>
  
  <!-- Loop label -->
  <text x="400" y="250" text-anchor="middle" 
        font-family="Inter, sans-serif" font-size="16" font-weight="600" 
        fill="#1e40af">
    THE LOOP
  </text>
  
  <!-- Description -->
  <text x="400" y="280" text-anchor="middle" 
        font-family="Inter, sans-serif" font-size="12" 
        fill="#475569">
    Cue → Routine → Reward → (back to Cue)
  </text>
  
  <!-- Example -->
  <text x="400" y="320" text-anchor="middle" 
        font-family="Inter, sans-serif" font-size="12" font-weight="500" 
        fill="#1e40af">
    Example: Phone buzzes (Cue) → Check phone (Routine) → See notification (Reward)
  </text>
  
  <!-- Source -->
  <text x="400" y="350" text-anchor="middle" 
        font-family="Inter, sans-serif" font-size="10" 
        fill="#94a3b8">
    Based on Charles Duhigg's "The Power of Habit"
  </text>
</svg>