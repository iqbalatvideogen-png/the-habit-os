<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="urgentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:0.2" />
    </linearGradient>
    <linearGradient id="notUrgentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:0.2" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" 
        font-family="Inter, sans-serif" font-size="24" font-weight="600" 
        fill="#1e293b">
    Time Management Matrix
  </text>
  
  <!-- Subtitle -->
  <text x="400" y="55" text-anchor="middle" 
        font-family="Inter, sans-serif" font-size="14" 
        fill="#64748b">
    The Eisenhower Matrix for Priority Management
  </text>
  
  <!-- Matrix -->
  <g transform="translate(150, 100)">
    <!-- Urgent & Important (Do Now) -->
    <rect x="0" y="0" width="225" height="175" rx="10" ry="10" 
          fill="#fee2e2" stroke="#ef4444" stroke-width="3"/>
    <text x="112.5" y="25" text-anchor="middle" 
          font-family="Inter, sans-serif" font-size="14" font-weight="600" 
          fill="#dc2626">
      URGENT & IMPORTANT
    </text>
    <text x="112.5" y="45" text-anchor="middle" 
          font-family="Inter, sans-serif" font-size="12" font-weight="600" 
          fill="#dc2626">
      DO NOW
    </text>
    <text x="112.5" y="70" text-anchor="middle" 
          font-family="Inter, sans-serif" font-size="10" 
          fill="#7f1d1d">
      Crises
    </text>
    <text x="112.5" y="85" text-anchor="middle" 
          font-family="Inter, sans-serif" font-size="10" 
          fill="#7f1d1d">
      Deadline-driven projects
    </text>
    <text x="112.5" y="100" text-anchor="middle" 
          font-family="Inter, sans-serif" font-size="10" 
          fill="#7f1d1d">
      Health emergencies
    </text>
    <text x="112.5" y="115" text-anchor="middle" 
          font-family="Inter, sans-serif" font-size="10" 
          fill="#7f1d1d">
      Last-minute preparations
    </text>
    
    <!-- Not Urgent & Important (Schedule) -->
    <rect x="275" y="0" width="225" height="175" rx="10" ry="10" 
          fill="#d1fae5" stroke="#10b981" stroke-width="3"/>
    <text x="387.5" y="25" text-anchor="middle" 
          font-family="Inter, sans-serif" font-size="14" font-weight="600" 
          fill="#059669">
      NOT URGENT & IMPORTANT
    </text>
    <text x="387.5" y="45" text-anchor="middle" 
          font-family="Inter, sans-serif" font-size="12" font-weight="600" 
          fill="#059669">
      SCHEDULE
    </text>
    <text x="387.5" y="70" text-anchor="middle" 
          font-family="Inter, sans-serif" font-size="10" 
          fill="#047857">
      Long-term planning
    </text>
    <text x="387.5" y="85" text-anchor="middle" 
          font-family="Inter, sans-serif" font-size="10" 
          fill="#047857">
      Relationship building
    </text>
    <text x="387.5" y="100" text-anchor="middle" 
          font-family="Inter, sans-serif" font-size="10" 
          fill="#047857">
      Personal development
    </text>
    <text x="387.5" y="115" text-anchor="middle" 
          font-family="Inter, sans-serif" font-size="10" 
          fill="#047857">
      Habit formation
    </text>
    
    <!-- Urgent & Not Important (Delegate) -->
    <rect x="0" y="225" width="225" height="175" rx="10" ry="10" 
          fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/>
    <text x="112.5" y="250" text-anchor="middle" 
          font-family="Inter, sans-serif" font-size="14" font-weight="600" 
          fill="#d97706">
      URGENT & NOT IMPORTANT
    </text>
    <text x="112.5" y="270" text-anchor="middle" 
          font-family="Inter, sans-serif" font-size="12" font-weight="600" 
          fill="#d97706">
      DELEGATE
    </text>
    <text x="112.5" y="295" text-anchor="middle" 
          font-family="Inter, sans-serif" font-size="10" 
          fill="#92400e">
      Interruptions
    </text>
    <text x="112.5" y="310" text-anchor="middle" 
          font-family="Inter, sans-serif" font-size="10" 
          fill="#92400e">
      Some meetings
    </text>
    <text x="112.5" y="325" text-anchor="middle" 
          font-family="Inter, sans-serif" font-size="10" 
          fill="#92400e">
      Some emails
    </text>
    <text x="112.5" y="340" text-anchor="middle" 
          font-family="Inter, sans-serif" font-size="10" 
          fill="#92400e">
      Some requests
    </text>
    
    <!-- Not Urgent & Not Important (Eliminate) -->
    <rect x="275" y="225" width="225" height="175" rx="10" ry="10" 
          fill="#f3f4f6" stroke="#9ca3af" stroke-width="3"/>
    <text x="387.5" y="250" text-anchor="middle" 
          font-family="Inter, sans-serif" font-size="14" font-weight="600" 
          fill="#6b7280">
      NOT URGENT & NOT IMPORTANT
    </text>
    <text x="387.5" y="270" text-anchor="middle" 
          font-family="Inter, sans-serif" font-size="12" font-weight="600" 
          fill="#6b7280">
      ELIMINATE
    </text>
    <text x="387.5" y="295" text-anchor="middle" 
          font-family="Inter, sans-serif" font-size="10" 
          fill="#4b5563">
      Time wasters
    </text>
    <text x="387.5" y="310" text-anchor="middle" 
          font-family="Inter, sans-serif" font-size="10" 
          fill="#4b5563">
      Trivial tasks
    </text>
    <text x="387.5" y="325" text-anchor="middle" 
          font-family="Inter, sans-serif" font-size="10" 
          fill="#4b5563">
      Pleasant activities
    </text>
    <text x="387.5" y="340" text-anchor="middle" 
          font-family="Inter, sans-serif" font-size="10" 
          fill="#4b5563">
      Distractions
    </text>
  </g>
  
  <!-- Labels -->
  <text x="400" y="90" text-anchor="middle" 
        font-family="Inter, sans-serif" font-size="12" font-weight="600" 
        fill="#1e293b">
    URGENT
  </text>
  <text x="650" y="200" text-anchor="middle" 
        font-family="Inter, sans-serif" font-size="12" font-weight="600" 
        fill="#1e293b" transform="rotate(90, 650, 200)">
    NOT URGENT
  </text>
  <text x="200" y="200" text-anchor="middle" 
        font-family="Inter, sans-serif" font-size="12" font-weight="600" 
        fill="#1e293b" transform="rotate(-90, 200, 200)">
    IMPORTANT
  </text>
  <text x="400" y="410" text-anchor="middle" 
        font-family="Inter, sans-serif" font-size="12" font-weight="600" 
        fill="#1e293b">
    NOT IMPORTANT
  </text>
  
  <!-- Source -->
  <text x="400" y="450" text-anchor="middle" 
        font-family="Inter, sans-serif" font-size="10" 
        fill="#94a3b8">
    Adapted from Dwight D. Eisenhower's decision matrix
  </text>
  
  <!-- Key -->
  <text x="400" y="475" text-anchor="middle" 
        font-family="Inter, sans-serif" font-size="11" font-weight="500" 
        fill="#1e40af">
    Key: Focus on Quadrant 2 (Not Urgent & Important) for long-term success
  </text>
</svg>