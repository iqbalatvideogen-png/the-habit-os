<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="visionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="stepGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f3f4f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e5e7eb;stop-opacity:1" />
    </linearGradient>
    <filter id="visionShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="4" stdDeviation="6" flood-color="rgba(0,0,0,0.1)" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" 
        font-family="Inter, sans-serif" font-size="24" font-weight="600" 
        fill="#1e293b">
    The Vision Framework
  </text>
  
  <!-- Subtitle -->
  <text x="400" y="55" text-anchor="middle" 
        font-family="Inter, sans-serif" font-size="14" 
        fill="#64748b">
    Creating a Compelling Future
  </text>
  
  <!-- Main Vision Circle -->
  <circle cx="400" cy="200" r="120" fill="url(#visionGrad)" stroke="#7c3aed" stroke-width="4" filter="url(#visionShadow)"/>
  
  <text x="400" y="190" text-anchor="middle" 
        font-family="Inter, sans-serif" font-size="18" font-weight="600" 
        fill="#ffffff">
    VISION
  </text>
  <text x="400" y="210" text-anchor="middle" 
        font-family="Inter, sans-serif" font-size="14" 
        fill="#e0e7ff">
    Your Ideal Future
  </text>
  
  <!-- Steps -->
  <g transform="translate(100, 300)">
    <!-- Step 1 -->
    <circle cx="0" cy="0" r="40" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" 
          font-family="Inter, sans-serif" font-size="16" font-weight="600" 
          fill="#1e40af">
      1
    </text>
    <text x="0" y="-50" text-anchor="middle" 
          font-family="Inter, sans-serif" font-size="12" font-weight="500" 
          fill="#1e40af">
      PAST
    </text>
    <text x="0" y="-65" text-anchor="middle" 
          font-family="Inter, sans-serif" font-size="10" 
          fill="#475569">
      Reflection
    </text>
  </g>
  
  <g transform="translate(300, 300)">
    <!-- Step 2 -->
    <circle cx="0" cy="0" r="40" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" 
          font-family="Inter, sans-serif" font-size="16" font-weight="600" 
          fill="#1e40af">
      2
    </text>
    <text x="0" y="-50" text-anchor="middle" 
          font-family="Inter, sans-serif" font-size="12" font-weight="500" 
          fill="#1e40af">
      FUTURE
    </text>
    <text x="0" y="-65" text-anchor="middle" 
          font-family="Inter, sans-serif" font-size="10" 
          fill="#475569">
      Envisioning
    </text>
  </g>
  
  <g transform="translate(500, 300)">
    <!-- Step 3 -->
    <circle cx="0" cy="0" r="40" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" 
          font-family="Inter, sans-serif" font-size="16" font-weight="600" 
          fill="#1e40af">
      3
    </text>
    <text x="0" y="-50" text-anchor="middle" 
          font-family="Inter, sans-serif" font-size="12" font-weight="500" 
          fill="#1e40af">
      PRESENT
    </text>
    <text x="0" y="-65" text-anchor="middle" 
          font-family="Inter, sans-serif" font-size="10" 
          fill="#475569">
      Action
    </text>
  </g>
  
  <g transform="translate(700, 300)">
    <!-- Step 4 -->
    <circle cx="0" cy="0" r="40" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" 
          font-family="Inter, sans-serif" font-size="16" font-weight="600" 
          fill="#1e40af">
      4
    </text>
    <text x="0" y="-50" text-anchor="middle" 
          font-family="Inter, sans-serif" font-size="12" font-weight="500" 
          fill="#1e40af">
      ALIGNMENT
    </text>
    <text x="0" y="-65" text-anchor="middle" 
          font-family="Inter, sans-serif" font-size="10" 
          fill="#475569">
      Integration
    </text>
  </g>
  
  <!-- Connecting arrows -->
  <path d="M140 300 L260 300" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M340 300 L460 300" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M540 300 L660 300" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Arrowhead definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
  </defs>
  
  <!-- Vision to Steps connection -->
  <path d="M400 280 L400 300" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Description -->
  <text x="400" y="400" text-anchor="middle" 
        font-family="Inter, sans-serif" font-size="12" font-weight="500" 
        fill="#1e40af">
    The Vision Process:
  </text>
  
  <text x="400" y="420" text-anchor="middle" 
        font-family="Inter, sans-serif" font-size="11" 
        fill="#475569">
    1. Reflect on your past experiences and lessons
  </text>
  <text x="400" y="435" text-anchor="middle" 
        font-family="Inter, sans-serif" font-size="11" 
        fill="#475569">
    2. Envision your ideal future in vivid detail
  </text>
  <text x="400" y="450" text-anchor="middle" 
        font-family="Inter, sans-serif" font-size="11" 
        fill="#475569">
    3. Take aligned action in the present
  </text>
  <text x="400" y="465" text-anchor="middle" 
        font-family="Inter, sans-serif" font-size="11" 
        fill="#475569">
    4. Integrate vision into all areas of life
  </text>
  
  <!-- Source -->
  <text x="400" y="490" text-anchor="middle" 
        font-family="Inter, sans-serif" font-size="10" 
        fill="#94a3b8">
    Chapter 40: The Vision Habit
  </text>
</svg>