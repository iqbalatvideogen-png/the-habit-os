<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f1f5f9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    <filter id="brainShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="4" stdDeviation="6" flood-color="rgba(0,0,0,0.1)" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" 
        font-family="Inter, sans-serif" font-size="24" font-weight="600" 
        fill="#1e293b">
    The Brain and Habits
  </text>
  
  <!-- Subtitle -->
  <text x="400" y="55" text-anchor="middle" 
        font-family="Inter, sans-serif" font-size="14" 
        fill="#64748b">
    How Your Brain Forms and Maintains Habits
  </text>
  
  <!-- Brain silhouette -->
  <path d="M200 100 C250 50, 350 50, 400 100 C450 50, 550 50, 600 100 C650 150, 650 250, 600 300 C550 350, 450 350, 400 300 C350 350, 250 350, 200 300 C150 250, 150 150, 200 100 Z" 
        fill="url(#brainGrad)" stroke="#cbd5e1" stroke-width="2" filter="url(#brainShadow)"/>
  
  <!-- Brain regions -->
  <circle cx="300" cy="150" r="25" fill="#3b82f6" opacity="0.8"/>
  <text x="300" y="155" text-anchor="middle" 
        font-family="Inter, sans-serif" font-size="10" font-weight="500" 
        fill="#ffffff">
    Prefrontal
  </text>
  <text x="300" y="170" text-anchor="middle" 
        font-family="Inter, sans-serif" font-size="8" 
        fill="#ffffff">
    Cortex
  </text>
  
  <circle cx="500" cy="150" r="25" fill="#2563eb" opacity="0.8"/>
  <text x="500" y="155" text-anchor="middle" 
        font-family="Inter, sans-serif" font-size="10" font-weight="500" 
        fill="#ffffff">
    Basal
  </text>
  <text x="500" y="170" text-anchor="middle" 
        font-family="Inter, sans-serif" font-size="8" 
        fill="#ffffff">
    Ganglia
  </text>
  
  <circle cx="400" cy="220" r="25" fill="#1e40af" opacity="0.8"/>
  <text x="400" y="225" text-anchor="middle" 
        font-family="Inter, sans-serif" font-size="10" font-weight="500" 
        fill="#ffffff">
    Nucleus
  </text>
  <text x="400" y="240" text-anchor="middle" 
        font-family="Inter, sans-serif" font-size="8" 
        fill="#ffffff">
    Accumbens
  </text>
  
  <!-- Arrows and labels -->
  <path d="M300 175 L200 200" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="200" y="210" text-anchor="middle" 
        font-family="Inter, sans-serif" font-size="10" 
        fill="#475569">
    Decision
  </text>
  <text x="200" y="225" text-anchor="middle" 
        font-family="Inter, sans-serif" font-size="10" 
        fill="#475569">
    Making
  </text>
  
  <path d="M500 175 L600 200" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="600" y="210" text-anchor="middle" 
        font-family="Inter, sans-serif" font-size="10" 
        fill="#475569">
    Habit
  </text>
  <text x="600" y="225" text-anchor="middle" 
        font-family="Inter, sans-serif" font-size="10" 
        fill="#475569">
    Formation
  </text>
  
  <path d="M400 245 L400 300" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="400" y="315" text-anchor="middle" 
        font-family="Inter, sans-serif" font-size="10" 
        fill="#475569">
    Reward
  </text>
  <text x="400" y="330" text-anchor="middle" 
        font-family="Inter, sans-serif" font-size="10" 
        fill="#475569">
    Processing
  </text>
  
  <!-- Key at bottom -->
  <rect x="250" y="380" width="300" height="80" rx="10" ry="10" 
        fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  
  <text x="260" y="400" text-anchor="start" 
        font-family="Inter, sans-serif" font-size="11" font-weight="500" 
        fill="#1e293b">
    Key Brain Regions in Habit Formation:
  </text>
  
  <text x="260" y="420" text-anchor="start" 
        font-family="Inter, sans-serif" font-size="10" 
        fill="#475569">
    • Prefrontal Cortex: Decision making, planning
  </text>
  <text x="260" y="435" text-anchor="start" 
        font-family="Inter, sans-serif" font-size="10" 
        fill="#475569">
    • Basal Ganglia: Habit formation, automatic behaviors
  </text>
  <text x="260" y="450" text-anchor="start" 
        font-family="Inter, sans-serif" font-size="10" 
        fill="#475569">
    • Nucleus Accumbens: Reward processing, motivation
  </text>
</svg>